name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Unit tests (no game files needed)
        run: |
          for t in bodyscale framing personality reboot social rooms hub i18n friendrooms gameroom miiphone miinstagram; do
            echo "::group::$t"
            npx --yes tsx@4.19.2 ../../tests/unit/$t.test.mts
            echo "::endgroup::"
          done
