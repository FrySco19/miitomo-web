name: Release

# Creates a GitHub release (and its tag) for every docs/releases/<version>.md that has no release yet.
# Attaches the built web client (code only, no game files). The notes file is the release text.
on:
  push:
    branches: [main]
    paths: ['docs/releases/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/web/package-lock.json
      - name: Build
        working-directory: client/web
        run: npm ci && npm run build
      - name: Create missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for notes in docs/releases/v*.md; do
            v=$(basename "$notes" .md)
            if gh release view "$v" >/dev/null 2>&1; then echo "$v already released"; continue; fi
            (cd client/web/dist && zip -qr "../../../miitomo-web-$v-web.zip" .)
            gh release create "$v" "miitomo-web-$v-web.zip" --target "$GITHUB_SHA" \
              --title "Miitomo Web $v" --notes-file "$notes" --prerelease
          done
