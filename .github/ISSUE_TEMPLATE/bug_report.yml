name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please leave personal information out of screenshots and logs, and do not attach game files.
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      description: Which part of the project is affected?
      options:
        - Miitomo Web (Classic, original port)
        - Miitomo Reboot
        - Both
        - Not sure
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and system
      placeholder: e.g. Chrome 130 on Windows 11
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The commit hash or the date of your checkout
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start with avvia-miitomo-web.bat
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or console logs
      description: Optional. Paste the browser console output if there is an error.
      render: text
